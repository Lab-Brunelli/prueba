name: NodeLockedLicenseApp
options:
  bundleIdPrefix: com.company
  deploymentTarget:
    iOS: "16.0"
targets:
  NodeLockedLicenseApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - ".github/**"
          - "project.yml"
    settings:
     PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
      CODE_SIGN_ENTITLEMENTS: NodeLockedLicenseApp.entitlements
