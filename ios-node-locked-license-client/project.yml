name: NodeLockedLicenseApp
options:
  bundleIdPrefix: com.company
  deploymentTarget:
    iOS: "17.0"
targets:
  NodeLockedLicenseApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - ".github/**"
          - "project.yml"
          - "FFAssets/**"
      - path: FFAssets
        type: folder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
      CODE_SIGN_ENTITLEMENTS: NodeLockedLicenseApp.entitlements
      INFOPLIST_FILE: Info.plist
      ENABLE_BITCODE: NO
      SWIFT_VERSION: "5.9"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
